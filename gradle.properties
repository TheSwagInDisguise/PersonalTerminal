# Project-wide Gradle settings.
# Heap sized for CI runners (7 GB on ubuntu-latest) – R8 + D8 need headroom when debug and release
# variants build in the same invocation. Low-memory machines can override in ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Kotlin daemon inherits Gradle's heap unless set explicitly
kotlin.daemon.jvmargs=-Xmx2g
# AndroidX package structure
android.useAndroidX=true
android.nonTransitiveRClass=true
# Kotlin code style
kotlin.code.style=official
# App version: MAJOR.MINOR only. The PATCH number is derived automatically from the release tags
# (highest existing vMAJOR.MINOR.N + 1) and versionCode from the CI run number – see app/build.gradle.kts.
# Bump this line by hand only for feature milestones (0.2 → 0.3); every successful CI build gets its own
# 0.2.0, 0.2.1, 0.2.2 … without touching it.
app.version=0.4

